<!doctype html>
<html lang="pt-BR">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CODE Whats</title>
    <link rel="stylesheet" href="styles.css">
  </head>

      <h1>CODE Whats</h1>

        <button type="button" class="cwl-btn cwl-btn-primary" data-action="open-whatsapp">Abrir WhatsApp Web</button>

      </div>
    </main>
    <script src="code-whats.config.js"></script>
    <script src="storage.js"></script>
    <script src="popup.js"></script>
